/* Full-screen workspace and clearer content hierarchy. */
body{padding:0;background:var(--bg)}
.shell{max-width:none;margin:0;border:0;border-radius:0;min-height:100vh;box-shadow:none;overflow:clip;grid-template-columns:200px minmax(0,1fr)}
.sidebar{height:100vh;overflow-y:auto;padding:24px 16px}
.sidebar-bottom{border:0;background:none;padding:20px 0 0}
.sidebar-bottom button{font-size:12px;padding:12px 8px}
.workspace{padding:0 28px 28px}
.topbar{height:80px}
.hero{min-height:140px;padding:24px 28px}
.homehero{min-height:210px}
.hero-actions:empty{display:none}
.stats{gap:16px;margin:20px 0}
.stat{padding:20px;min-height:105px}
.stat small{font-size:13px}
.stat strong{font-size:28px}
.stat-footer{font-size:12px;margin-top:12px}
.panel{padding:20px}
.panel-head{margin-bottom:20px;flex-wrap:wrap}
.panel-head h2{font-size:16px}
.panel-head button,.panel-head select{font-size:12px}
.row{padding:15px 0}
.row-main b{font-size:13px;line-height:1.5}
.row-main small,.row time{font-size:12px}
.legend,.chart text{font-size:12px}
.badge{font-size:11px}
.task-card{padding:16px}
.task-card h3{font-size:14px;overflow-wrap:anywhere}
.task-card p{font-size:12px;line-height:1.6}
.task-card p:empty{display:none}
.task-top .badge{font-size:11px;height:auto;align-self:start}
.task-bottom{font-size:12px;gap:8px}
.task-card select{font-size:12px;max-width:125px}
th,td .sub{font-size:12px}td{font-size:13px;padding:16px 14px}
.field{font-size:13px;margin-bottom:18px}
.section-note{font-size:12px}
.invoice-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.paper{min-width:0;overflow-wrap:anywhere}
.paper table{table-layout:fixed}.paper th:first-child{width:40%}
.paper th,.paper td{overflow-wrap:anywhere}
.invoice-item{grid-template-columns:minmax(0,2fr) minmax(50px,.6fr) minmax(65px,1fr) 32px}
@media(max-width:1180px){.shell{grid-template-columns:180px minmax(0,1fr)}.workspace{padding:0 20px 24px}.invoice-layout{grid-template-columns:minmax(0,1fr)}.stat{padding:16px}.stat strong{font-size:24px}}
@media(max-width:760px){.shell{display:block}.workspace{padding:0 14px 24px}.sidebar{width:220px}.hero{padding:20px}.stat{padding:14px}.stat small{font-size:12px}.stat strong{font-size:23px}.panel{padding:16px}.task-card{padding:12px}.kanban{grid-template-columns:minmax(0,1fr)}.task-top{display:flex}.topbar{height:68px}}
@media print{.shell,.workspace{display:block;padding:0}.paper{overflow-wrap:anywhere}}
/* Chakra OS v2 */
:root{--accent:#ff681f;--accent-ink:#fff}
button.primary,.tabs button.selected,.view-switch button.selected{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:none}
button.primary:hover{filter:brightness(1.12);background:var(--accent)}
nav button.active{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
nav button.active:before,.dot,.logo,.switch.on,.accent-line{background:var(--accent)}
.hero h1 em,.paper-total strong{color:var(--accent)}
.progress span{background:var(--accent)}
.tile:not(.green):not(.blue):not(.red){background:color-mix(in srgb,var(--accent) 17%,#121515);color:var(--accent)}

projects=function(){let html=originalProjects(),start=html.indexOf('<div class="table-wrap">');const list=db.projects.filter(p=>(filter==='All'||filter==='Active'&&!['Delivered','Archived','Portfolio Queue','On Hold'].includes(p.status)||p.status===filter)&&(!query||(p.name+' '+p.client).toLowerCase().includes(query.toLowerCase())));if(projectSort==='date')list.sort((a,b)=>a.due.localeCompare(b.due));if(projectSort==='name')list.sort((a,b)=>a.name.localeCompare(b.name));const open=db.projects.filter(p=>!['Delivered','Archived','Portfolio Queue'].includes(p.status)),late=open.filter(p=>p.due<today()),budget=open.reduce((s,p)=>s+(+p.budget||0),0);const controls=`<div class="view-toolbar">${viewButtons('projects',projectView,['Table','Cards','Board'])}<span class="section-note">Progress from linked tasks</span></div><div class="project-insights"><span><b>${money(budget)}</b> active budget</span><span><b>${late.length}</b> overdue projects</span><span><b>${open.length?Math.round(open.reduce((s,p)=>s+p.progress,0)/open.length):0}%</b> average completion</span><span><b>${db.tasks.filter(t=>!t.project).length}</b> unlinked tasks</span></div>`;const card=p=>`<article class="panel project-card"><div class="panel-head"><h2>${esc(p.name)}</h2>${badge(p.status)}</div><p class="muted">${esc(p.client)}</p><div class="progress-cell"><b>${p.progress}%</b>${progress(p.progress)}</div><div class="project-meta"><span>${db.tasks.filter(t=>t.project===p.id&&t.status==='Done').length}/${db.tasks.filter(t=>t.project===p.id).length} tasks done</span><span>${money(p.budget)}</span></div><div class="row"><div class="row-main"><small>Due ${date(p.due)}</small></div><button data-edit="projects:${esc(p.id)}">Open</button></div></article>`;let body=projectView==='Cards'?`<div class="project-cards">${list.map(card).join('')}</div>`:projectView==='Board'?`<div class="project-board">${['Planning','In Progress','In Review','On Hold','Delivered','Portfolio Queue','Archived'].filter(s=>list.some(p=>p.status===s)).map(s=>`<section class="column"><h3>${s}</h3>${list.filter(p=>p.status===s).map(card).join('')}</section>`).join('')}</div>`:html.slice(start).replace(/<tbody id="project-rows">[\s\S]*?<\/tbody>/,`<tbody id="project-rows">${projectRows(list)}</tbody>`);return html.slice(0,start)+controls+(list.length?body:'<div class="empty">No matching projects</div>');};
function chart(period=6){const months=Array.from({length:period},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-period+1+i);return{key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),label:d.toLocaleDateString('en',{month:'short'})}});const income=months.map(m=>db.transactions.filter(t=>t.date?.startsWith(m.key)&&t.type==='Income').reduce((s,t)=>s+ +t.amount,0)),expense=months.map(m=>db.transactions.filter(t=>t.date?.startsWith(m.key)&&t.type==='Expense').reduce((s,t)=>s+ +t.amount,0)),profit=income.map((x,i)=>x-expense[i]);const all=[...income,...expense,...profit],low=Math.min(0,...all),high=Math.max(1,...all)*1.12,range=high-low;const y=n=>220-(n-low)/range*185,x=i=>65+i*615/(period-1),points=a=>a.map((n,i)=>`${x(i)},${y(n)}`).join(' '),total=income.reduce((a,b)=>a+b,0),cost=expense.reduce((a,b)=>a+b,0);const compact=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);return `<div class="chart-summary"><span>Revenue <b>${money(total)}</b></span><span>Expenses <b>${money(cost)}</b></span><span>Net <b>${money(total-cost)}</b></span></div><div class="legend"><span><i class="dot"></i>Revenue</span><span><i class="dot" style="background:#a7b8c8"></i>Expenses</span><span><i class="dot" style="background:#46d795"></i>Net profit</span></div><div class="chart-container"><svg class="chart detailed-chart" viewBox="0 0 710 260" role="img" aria-label="${period} month revenue, expenses and net profit in ${esc(db.settings.currency)}">${[0,1,2,3,4].map(i=>{const n=low+range*i/4;return `<line class="gridline" x1="65" y1="${y(n)}" x2="680" y2="${y(n)}"/><text x="55" y="${y(n)+4}" text-anchor="end">${compact(n)}</text>`}).join('')}<polyline points="${points(income)}" fill="none" stroke="var(--accent)" stroke-width="3"/><polyline points="${points(expense)}" fill="none" stroke="#a7b8c8" stroke-width="2"/><polyline points="${points(profit)}" fill="none" stroke="#46d795" stroke-width="2" stroke-dasharray="5 4"/>${months.map((m,i)=>`<text x="${x(i)}" y="250" text-anchor="middle">${m.label}${i===period-1?'*':''}</text><circle tabindex="0" cx="${x(i)}" cy="${y(income[i])}" r="5" fill="var(--accent)"><title>${m.label}: Revenue ${money(income[i])}; Expenses ${money(expense[i])}; Net ${money(profit[i])}</title></circle>`).join('')}</svg></div><div class="chart-foot"><span>${db.settings.currency} · *Current month to date</span><details><summary>View exact figures</summary><div class="table-wrap"><table><thead><tr><th>Month</th><th>Revenue</th><th>Expenses</th><th>Net</th></tr></thead><tbody>${months.map((m,i)=>`<tr><td>${m.label}</td><td>${money(income[i])}</td><td>${money(expense[i])}</td><td>${money(profit[i])}</td></tr>`).join('')}</tbody></table></div></details></div>`;}

function fxPanel(){return `<div class="fx-panel"><b>1 USD = ${Number(db.settings.fx).toFixed(2)} LKR</b><small>${fxBusy?'Refreshing…':fxError?esc(fxError):db.settings.fxUpdated?'Updated '+date(db.settings.fxUpdated):'Awaiting first live rate'}</small><button type="button" data-refresh-fx>Refresh rate</button><a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates by ExchangeRate-API</a></div>`;}
async function refreshFX(force=false){if(fxBusy||(!force&&Date.now()-(db.settings.fxChecked||0)<86400000))return;fxBusy=true;try{const res=await fetch('https://open.er-api.com/v6/latest/USD',{signal:AbortSignal.timeout(12000)});if(!res.ok)throw Error('Rate service unavailable');const data=await res.json();if(data.result!=='success'||!Number.isFinite(data.rates?.LKR)||data.rates.LKR<=0)throw Error('Invalid exchange rate');db.settings.fx=data.rates.LKR;db.settings.fxUpdated=new Date(data.time_last_update_unix*1000).toISOString();db.settings.fxChecked=Date.now();fxError='';save();}catch(e){fxError='Live rate unavailable · using last saved rate';}finally{fxBusy=false;if(!$('#modal').open&&['settings','subscriptions'].includes(page))render();}}

edit=function(kind,recordId,status){originalEdit(kind,recordId,status);const form=$('#record-form'),x=db[kind]?.find(x=>x.id===recordId)||{};if(kind==='tasks'){const div=document.createElement('section');div.className='checklist-editor';div.innerHTML=`<div class="panel-head"><h3>Checklist</h3><button type="button" id="add-check">Add step</button></div><p class="section-note">Progress updates as steps are completed. With no checklist, mark the task Done to complete it.</p><div id="checklist-rows"></div>`;form.querySelector('.dialog-actions').before(div);const add=c=>{const row=document.createElement('div');row.className='checklist-edit-row';row.dataset.checkId=c.id||id();row.innerHTML=`<input type="checkbox" data-check-done aria-label="Step completed" ${c.done?'checked':''}><input data-check-text aria-label="Checklist step" value="${esc(c.text||'')}" placeholder="Describe a step"><button type="button" aria-label="Remove step">${icon('trash')}</button>`;row.querySelector('button').onclick=()=>row.remove();$('#checklist-rows').append(row);};(x.checklist||[]).forEach(add);$('#add-check').onclick=()=>add({});}if(kind==='projects'){const note=document.createElement('p');note.className='section-note';note.textContent='Progress is calculated from linked tasks. Projects with no tasks start at 0% unless delivered.';form.querySelector('.dialog-actions').before(note);}if(kind==='users'){form.dataset.photo=x.photo||'';const label=document.createElement('label');label.className='field';label.innerHTML=`Profile photo <input type="file" accept="image/png,image/jpeg,image/webp"><span id="photo-preview">${avatar(x.name||'Member')}</span>`;form.querySelector('.dialog-actions').before(label);label.querySelector('input').onchange=async e=>{try{const value=await imageData(e.target.files[0],256,180000);form.dataset.photo=value;$('#photo-preview').innerHTML=`<img class="avatar" src="${value}" alt="Profile preview">`;}catch(e){toast(e.message)}};}}
async function imageData(file,width=1600,maxBytes=800000){if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Choose a PNG, JPG or WebP image');if(file.size>10*1024*1024)throw Error('Image must be smaller than 10 MB');const bitmap=await createImageBitmap(file);const ratio=Math.min(1,width/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*ratio));canvas.height=Math.max(1,Math.round(bitmap.height*ratio));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const value=canvas.toDataURL('image/webp',.85);if(value.length>maxBytes)throw Error('Image is too detailed. Try a smaller file.');return value;}

function localPortal(c){return {client:{name:c.name,id:c.id},settings:db.settings,projects:db.projects.filter(p=>p.client===c.name),invoices:db.invoices.filter(i=>i.client===c.name&&i.status!=='Draft')};}
function portalHTML(data){const cur=data.settings.currency||'USD';return `<div class="portal-content"><h2>${esc(data.client.name)}</h2><p class="muted">Your projects and invoices</p><h3>Projects</h3>${data.projects.map(p=>`<div class="panel"><div class="panel-head"><h2>${esc(p.name)}</h2>${badge(p.status)}</div><div class="progress-cell">${Number(p.progress)||0}% ${progress(p.progress)}</div><p class="section-note">Due ${date(p.due)}</p></div>`).join('')||'<p>No shared projects yet.</p>'}<h3>Invoices</h3>${data.invoices.map(i=>`<details class="panel"><summary>${esc(i.number)} · ${money(totalInvoice(i),i.currency||cur)} · ${esc(i.status)}</summary><p>Issued ${date(i.issued)} · Due ${date(i.due)}</p><div class="table-wrap"><table><thead><tr><th>Description</th><th>Qty</th><th>Rate</th></tr></thead><tbody>${i.items.map(x=>`<tr><td>${esc(x.description)}</td><td>${x.qty}</td><td>${money(x.rate,i.currency||cur)}</td></tr>`).join('')}</tbody></table></div></details>`).join('')||'<p>No issued invoices yet.</p>'}</div>`;}
async function renderPortal(){const cid=decodeURIComponent(page.slice(7));$('#app').innerHTML=`<main class="portal-shell"><header><h1>Client Portal</h1><button id="portal-account">${session?'Account':'Sign In'}</button></header><div id="portal-body">${session?'Loading your projects…':'Sign in with the email your studio enabled for this portal.'}</div></main>`;$('#portal-account').onclick=accountDialog;if(!session)return;const {data,error}=await cloud.rpc('chakra_portal',{requested_client:cid});if(page!=='portal='+encodeURIComponent(cid)&&page!=='portal='+cid)return;if(error){$('#portal-body').textContent=error.message;return}portalData=data;document.documentElement.style.setProperty('--accent',safeAccent(data.settings.accent));$('#portal-body').innerHTML=(safeImage(data.settings.appLogo)?`<img class="brand-image" alt="Studio logo" src="${safeImage(data.settings.appLogo)}">`:'')+`<p>${esc(data.settings.studio)}</p>`+portalHTML(data);}
function accountDialog(){if(session){modal('Your Account',`<p>${esc(session.user.email)}</p><p class="section-note">${access?esc(access.role)+' access':'No workspace access enabled for this email.'} · ${esc(cloudState)}</p><div class="account-actions">${access&&access.role!=='client'?`<button id="load-cloud">Reload Cloud Workspace</button>${access.role==='owner'?'<button id="upload-cloud">Upload This Workspace</button>':''}<button id="export-unsynced">Export Current Data</button>`:''}<button id="sign-out">Sign Out</button></div>`);if($('#load-cloud'))$('#load-cloud').onclick=()=>confirmCloudLoad();if($('#upload-cloud'))$('#upload-cloud').onclick=()=>confirmCloudUpload();if($('#export-unsynced'))$('#export-unsynced').onclick=()=>action('export');$('#sign-out').onclick=async()=>{await cloud.auth.signOut();session=null;access=null;cloudMode=false;cloudConflict=false;cloudPending=false;db=JSON.parse(localStorage.getItem(key))||structuredClone(seed);$('#modal').close();render()};return;}modal('Sign In',`<form id="auth-form">${field('Email',input('email','','email',true,'autocomplete="email"'))}${field('Password',input('password','','password',true,'minlength="8" autocomplete="current-password"'))}<div class="dialog-actions"><button class="primary" name="mode" value="login">Sign In</button><button name="mode" value="signup">Create Account</button></div><p id="auth-message" role="status" class="section-note"></p></form><p class="section-note">Use your own email. Creating an account does not grant access until the studio owner enables it.</p>`);$('#auth-form').onsubmit=async e=>{e.preventDefault();const form=e.target,v=Object.fromEntries(new FormData(form)),signup=e.submitter?.value==='signup';const msg=$('#auth-message');msg.textContent=signup?'Creating account…':'Signing in…';form.querySelectorAll('button').forEach(b=>b.disabled=true);try{const result=signup?await cloud.auth.signUp({email:v.email,password:v.password,options:{emailRedirectTo:APP_URL}}):await cloud.auth.signInWithPassword({email:v.email,password:v.password});if(result.error)throw result.error;if(!result.data.session){msg.textContent='Check your email to confirm your account, then sign in. If email delivery fails, the workspace owner needs to configure email delivery in Supabase.';return}session=result.data.session;await loadAccess();$('#modal').close();if(access?.role==='client'){page='portal='+access.client_id;render()}else if(access){await loadCloud(false);render();if(!cloudMode)accountDialog();}else{render();accountDialog()}}catch(err){msg.textContent=err.message;}finally{form.querySelectorAll('button').forEach(b=>b.disabled=false)}};}
async function loadAccess(){const {data,error}=await cloud.from('chakra_members').select('*').eq('email',session.user.email.toLowerCase()).eq('active',true).maybeSingle();if(error)throw error;access=data;}
async function loadCloud(force){const {data,error}=await cloud.from('chakra_workspace').select('*').eq('id',true).single();if(error)throw error;cloudRevision=Number(data.revision);if(data.data){if(!validDB(data.data))throw Error('Cloud workspace has an invalid format');db=data.data;cloudMode=true;cloudConflict=false;cloudPending=false;cloudState='Synced';}else{cloudState='Cloud workspace is empty';cloudMode=false;}return !!data.data;}
function confirmCloudLoad(){modal('Reload cloud data?',`<p>Unsynced changes will be replaced. Export them first if needed.</p><button id="backup-cloud">Export Current Data</button><button id="confirm-cloud-load" class="primary">Reload Cloud</button>`);$('#backup-cloud').onclick=()=>action('export');$('#confirm-cloud-load').onclick=async()=>{try{await loadCloud(true);$('#modal').close();render()}catch(e){toast(e.message)}};}
function confirmCloudUpload(){modal('Upload this workspace?',`<p>Upload ${db.projects.length} projects, ${db.tasks.length} tasks and studio settings to the shared workspace. This replaces existing cloud records.</p><p class="section-note">Your current browser workspace remains available when signed out.</p><button id="confirm-cloud-upload" class="primary">Upload Workspace</button>`);$('#confirm-cloud-upload').onclick=async()=>{try{const {data,error}=await cloud.from('chakra_workspace').select('revision').eq('id',true).single();if(error)throw error;cloudRevision=Number(data.revision);cloudMode=true;cloudConflict=false;save('Workspace uploaded');await flushCloud();$('#modal').close();render()}catch(e){toast(e.message)}};}
// Initialize only after all overrides are installed.
async function bootStudio(){normalizeWorkspace();cloud=window.createSupabaseClient(CLOUD_URL,CLOUD_KEY);const {data}=await cloud.auth.getSession();session=data.session;if(session){try{await loadAccess();if(access&&access.role!=='client')await loadCloud(false);}catch(e){cloudState='Cloud unavailable';}}render();void refreshFX();setInterval(()=>refreshFX(),3600000);window.addEventListener('focus',()=>refreshFX());window.addEventListener('beforeunload',e=>{if(cloudPending||cloudBusy){e.preventDefault();e.returnValue=''}});}
bootStudio();
</script></body></html>
