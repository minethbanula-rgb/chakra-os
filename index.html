function toast(msg){window.studioMotion?.run($('#toast'),{opacity:[0,1]},.15,typeof db==='undefined'?'System':db.settings.motion);$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),3600)}
function go(p){if(p===page){render();return}location.hash=p}
window.addEventListener('hashchange',()=>{page=location.hash.slice(1)||'home';filter=page==='projects'?'Active':'All';query='';render()});
function badge(v){const color=/Done|Delivered|Active|Paid|Completed|On track/.test(v)?'green':/Hold|High|Overdue|Blacklisted/.test(v)?'red':/Review/.test(v)?'purple':/Low|Planning|Upcoming/.test(v)?'blue':'gray';return `<span class="badge ${color}">${esc(v)}</span>`}
function legacyAvatar(name='Mineth',i=0){return `<span class="avatar" title="${esc(name)}" style="background:linear-gradient(140deg,${['#a56c48,#493941','#557c73,#303c40','#8b6678,#413650'][i%3]})">${esc(initials(name))}</span>`}
const avatars=()=>`<div class="avatars">${db.users.slice(0,3).map((u,i)=>avatar(u.name,i)).join('')}</div>`;
function progress(v){v=Math.min(100,Math.max(0,+v||0));return `<div class="progress"><span style="width:${v}%"></span></div>`}
function stat(title,value,ico,color='orange',note=''){return `<div class="stat"><div class="stat-head"><span class="tile ${color}">${icon(ico)}</span><div><small>${esc(title)}</small><strong>${esc(value)}</strong></div></div>${note?`<div class="stat-footer">${esc(note)}</div>`:''}</div>`}
function panel(title,ico,body,action='',sub=''){return `<section class="panel"><div class="panel-head"><div class="panel-title"><span class="tile">${icon(ico)}</span><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div></div>${action}</div>${body}</section>`}
const navbutton=(title,p)=>`<button data-go="${p}">${title} ${icon('arrow')}</button>`;
function hero(title,sub,button=''){return heading(title,sub,button)}
function heading(title,sub,action=''){return `<div class="page-head"><div><h1>${title}</h1><div class="muted">${sub}</div></div>${action}</div>`}
const addBtn=(kind,label)=>`<button class="primary" data-add="${kind}">${icon('plus')}${label}</button>`;
const revenue=()=>db.transactions.filter(t=>t.type==='Income').reduce((a,t)=>a+Number(t.amount),0),expenses=()=>db.transactions.filter(t=>t.type==='Expense').reduce((a,t)=>a+Number(t.amount),0),totalInvoice=i=>i.items.reduce((s,x)=>s+(+x.qty)*(+x.rate),0)*(1+(+i.tax||0)/100),outstanding=()=>db.invoices.filter(i=>i.status==='Sent'||i.status==='Overdue').reduce((a,i)=>a+totalInvoice(i),0);
function taskRows(){return db.tasks.filter(t=>t.status!=='Done').sort((a,b)=>(a.priority==='High'?-1:0)-(b.priority==='High'?-1:0)||a.due.localeCompare(b.due)).slice(0,5).map(t=>`<div class="row"><span class="monogram">${icon('tasks')}</span><div class="row-main"><b>${esc(t.title)}</b><small>${esc(db.projects.find(p=>p.id===t.project)?.name||'Studio')}</small></div><div style="width:50px">${progress(t.progress)}</div><button class="iconbtn" data-edit="tasks:${t.id}" aria-label="Edit ${esc(t.title)}">${icon('chevron')}</button></div>`).join('')||'<div class="empty">All caught up.</div>'}
function home(){const open=db.projects.filter(isOpenProject),attention=open.filter(p=>p.due<today()||p.status==='On Hold');return heading('Studio overview',attention.length?attention.length+(attention.length===1?' project needs attention':' projects need attention'):'Your projects, priorities and finances.',addBtn('projects','New project'))+`<div class="stats">${stat('Revenue',money(reportingTotals().revenue),'money','green',reportingPeriodLabel())}${stat('Net profit',money(reportingTotals().revenue-reportingTotals().expenses),'chart','gray',reportingPeriodLabel())}${stat('Outstanding',money(outstanding()),'clock','red','Sent and overdue invoices')}${stat('Open projects',open.length,'layers','blue','Includes On Hold')}</div><div class="grid home-grid">${panel('Project attention','projects',attention.map(p=>`<div class="row"><div class="row-main"><b>${esc(p.name)}</b><small>${esc(p.client)} · Due ${date(p.due)}</small></div>${badge(p.status)}<button data-edit="projects:${esc(p.id)}">Open</button></div>`).join('')||'<div class="empty">No projects need attention.</div>',navbutton('All projects','projects'))}${panel('Priority tasks','tasks',taskRows(),navbutton('All tasks','tasks'))}</div><div class="grid home-finance">${panel('Cashflow','chart',chart(),rangeControl())}${panel('Recent activity','clock',db.activity.slice(0,4).map(a=>`<div class="row"><div class="row-main"><b>${esc(a.text)}</b><small>${date(a.date)}</small></div></div>`).join('')||'<div class="empty">No recent activity.</div>')}</div>`}
function projectRows(list){return list.map(p=>`<tr><td><div class="project-name"><span class="monogram">${esc(initials(p.name))}</span>${esc(p.name)}</div></td><td>${esc(p.client)}</td><td>${badge(p.status)}</td><td><div class="progress-cell">${p.progress}% ${progress(p.progress)}</div></td><td>${date(p.due)}</td><td>${avatars()}</td><td><button class="iconbtn" data-edit="projects:${p.id}" aria-label="Edit ${esc(p.name)}">${icon('edit')}</button></td></tr>`).join('')}
function search(placeholder){return `<div class="searchbox">${icon('search')}<input id="page-search" placeholder="${placeholder}" value="${esc(query)}" aria-label="${placeholder}"></div>`}
function tasks(){let list=db.tasks.filter(t=>(filter==='All'||filter==='Mine'&&isMyTask(t)||filter==='Overdue'&&t.due<today()&&t.status!=='Done'||filter==='Done'&&t.status==='Done')&&(!query||t.title.toLowerCase().includes(query.toLowerCase())));return hero('Tasks','Manage studio execution across projects.',addBtn('tasks','New Task'))+`<div class="toolbar"><div class="tabs">${['All','Mine','Overdue','Done'].map(x=>`<button data-filter="${x}" class="${filter===x?'selected':''}">${x}</button>`).join('')}</div>${search('Find a task...')}</div><div class="stats">${stat('Total Tasks',db.tasks.length,'chart')}${stat('Due Today',db.tasks.filter(t=>t.due===today()&&t.status!=='Done').length,'clock','red')}${stat('In Progress',db.tasks.filter(t=>t.status==='In Progress').length,'clock','blue')}${stat('Completed',db.tasks.filter(t=>t.status==='Done').length,'tasks','green')}</div><div class="kanban">${['Backlog','In Progress','Review','Done'].map(status=>`<section class="column" data-drop="${status}"><div class="column-head"><span>${status} <small>(${list.filter(t=>t.status===status).length})</small></span><button data-add="tasks" data-status="${status}" aria-label="Add task to ${status}">${icon('plus')}</button></div>${list.filter(t=>t.status===status).map(t=>`<article class="task-card" draggable="true" data-task="${t.id}"><div class="task-top"><h3>${esc(t.title)}</h3>${badge(t.priority)}</div><div class="section-note">${esc(db.projects.find(p=>p.id===t.project)?.name||'Studio')}</div><p>${esc(t.description==='Keep the next step clear and move the project forward.'?'':t.description)}</p><div class="progress-cell"><small>${t.progress}%</small>${progress(t.progress)}</div><div class="task-bottom"><span>${date(t.due)}</span>${avatar(t.assignee)}</div><div class="task-bottom"><select aria-label="Status for ${esc(t.title)}" data-task-status="${t.id}">${options(['Backlog','In Progress','Review','Done'],t.status)}</select><button class="iconbtn" data-edit="tasks:${t.id}" aria-label="Edit ${esc(t.title)}">${icon('edit')}</button></div></article>`).join('')||'<div class="empty">Drop tasks here</div>'}</section>`).join('')}</div><p class="section-note">Drag cards between columns, or use each card’s status menu.</p>`}
function clients(){const list=db.clients.filter(c=>(filter==='All'||c.status===filter)&&(!query||(c.name+c.contact+c.email).toLowerCase().includes(query.toLowerCase())));const c=list.find(x=>x.id===clientSelected)||list[0];return hero('Clients','Strong relationships. Exceptional work.',addBtn('clients','Add Client'))+`<div class="stats">${stat('Total Clients',db.clients.length,'clients')}${stat('Active Clients',db.clients.filter(c=>c.status==='Active').length,'users','green')}${stat('Inactive',db.clients.filter(c=>c.status==='Inactive').length,'clock','blue')}${stat('Outstanding Receivables',money(outstanding()),'money')}</div><div class="toolbar"><div class="tabs">${['All','Active','Inactive','Blacklisted'].map(x=>`<button data-filter="${x}" class="${filter===x?'selected':''}">${x}</button>`).join('')}</div>${search('Search clients by name or contact...')}</div><div class="client-layout"><div class="table-wrap"><table><thead><tr><th>Client</th><th>Contact</th><th>Projects</th><th>Status</th><th></th></tr></thead><tbody>${list.map(x=>`<tr class="clickable ${c?.id===x.id?'selected-row':''}" data-client="${x.id}" tabindex="0" role="button" aria-label="Select ${esc(x.name)}"><td><div class="project-name"><span class="monogram">${esc(initials(x.name))}</span><div>${esc(x.name)}<span class="sub">${esc(x.email)}</span></div></div></td><td>${esc(x.contact)}</td><td>${db.projects.filter(p=>p.client===x.name).length}</td><td>${badge(x.status)}</td><td>${icon('chevron')}</td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">No matching clients</div>':''}</div>${c?`<section class="panel detail"><div class="detail-head"><span class="monogram">${esc(initials(c.name))}</span><div><strong>${esc(c.name)}</strong><p class="section-note">${esc(c.website)}</p></div>${badge(c.status)}</div><dl><dt>Primary Contact</dt><dd>${esc(c.contact)}</dd><dt>Email</dt><dd><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></dd><dt>Phone</dt><dd>${esc(c.phone)||'Not provided'}</dd><dt>Industry</dt><dd>${esc(c.industry)}</dd><dt>Location</dt><dd>${esc(c.location)}</dd></dl><h3 style="font-size:13px">Notes</h3><p class="section-note">${esc(c.notes)||'Add notes about your relationship and next steps.'}</p><div class="mini-stats"><div><strong>${db.projects.filter(p=>p.client===c.name).length}</strong><small>Projects</small></div><div style="grid-column:span 2"><strong>${money(db.invoices.filter(i=>i.client===c.name&&['Sent','Overdue'].includes(i.status)).reduce((s,i)=>s+totalInvoice(i),0))}</strong><small>Outstanding</small></div></div><button class="primary wide" style="margin-top:22px" data-edit="clients:${c.id}">Edit Client ${icon('arrow')}</button></section>`:''}</div>`}
function subscriptions(){const active=db.subscriptions.filter(s=>s.status==='Active'),monthly=active.reduce((s,x)=>s+ +x.amount,0),list=db.subscriptions.filter(s=>(filter==='All'||s.status===filter)&&s.name.toLowerCase().includes(query.toLowerCase()));return hero('Subscriptions','Manage recurring tools, renewals, FX rates, and reminders.',addBtn('subscriptions','Add Subscription'))+`<div class="stats">${stat('Monthly Recurring',money(monthly,'USD'),'finance','green','≈ '+money(monthly*db.settings.fx,'LKR'))}${stat('Annualized',money(monthly*12,'USD'),'chart','orange','12 × monthly cost')}${stat('Active Subscriptions',active.length,'layers','blue')}${stat('Renewing in 7 days',active.filter(s=>s.renewal>=today()&&s.renewal<=offset(7)).length,'bell','red')}</div><div class="toolbar"><h3>All Subscriptions (${list.length})</h3>${search('Search subscriptions...')}<select id="status-filter" aria-label="Subscription status">${options(['All','Active','Paused'],filter)}</select></div><div class="table-wrap"><table><thead><tr><th>Tool / Service</th><th>Website</th><th>Amount (USD)</th><th>Amount (LKR)</th><th>Renewal Date</th><th>Reminder</th><th>Auto-Renew</th><th>Status</th><th></th></tr></thead><tbody>${list.map((s,i)=>`<tr><td><div class="project-name">${faviconMarkup(s)}${esc(s.name)}</div></td><td><a href="https://${esc(s.website.replace(/^https?:\/\//,''))}" target="_blank" rel="noopener noreferrer">${esc(s.website)}</a></td><td>${money(s.amount,'USD')}</td><td>${money(s.amount*db.settings.fx,'LKR')}</td><td>${date(s.renewal)}</td><td>${s.reminder} days before</td><td><button class="switch ${s.auto?'on':''}" role="switch" aria-checked="${s.auto}" aria-label="Track auto-renew for ${esc(s.name)}" data-toggle-sub="${s.id}"></button></td><td>${badge(s.status)}</td><td><button class="iconbtn" data-edit="subscriptions:${s.id}" aria-label="Edit ${esc(s.name)}">${icon('edit')}</button></td></tr>`).join('')}</tbody></table></div><div class="grid equal">${panel('Upcoming Renewals','clock',active.sort((a,b)=>a.renewal.localeCompare(b.renewal)).slice(0,3).map(s=>`<div class="row">${faviconMarkup(s)}<div class="row-main"><b>${esc(s.name)}</b><small>${money(s.amount,'USD')} · ${date(s.renewal)}</small></div><button data-edit="subscriptions:${s.id}">Manage</button></div>`).join(''))}${panel('Reminder Center','bell',`<p class="section-note">Renewal reminders appear here while the app is open. Auto-renew tracks your preference; it does not change your provider’s billing.</p>${active.filter(s=>s.renewal<=offset(s.reminder)&&s.renewal>=today()).map(s=>`<div class="row"><span class="tile">${icon('bell')}</span><div class="row-main"><b>${esc(s.name)} renews soon</b><small>${date(s.renewal)} · ${money(s.amount,'USD')}</small></div></div>`).join('')||'<div class="empty">No reminders due yet.</div>'}`)}</div>`}
function expenseGradient(){const r=reportRange(),periodTransactions=db.transactions.filter(t=>t.date>=r.start&&t.date<=r.end),cats=[...new Set(periodTransactions.filter(t=>t.type==='Expense').map(t=>t.category))],colors=['#ff7025','#e74d10','#ab491c','#777','#a6aba5'];let n=0;return reportingTotals().expenses?'conic-gradient('+cats.map((c,i)=>{let start=n;n+=periodTransactions.filter(t=>t.type==='Expense'&&t.category===c).reduce((a,t)=>a+ +t.amount,0)/reportingTotals().expenses*100;return colors[i%colors.length]+' '+start+'% '+n+'%'}).join(',')+')':'#333'}
function finance(){const r=reportRange(),periodTransactions=db.transactions.filter(t=>t.date>=r.start&&t.date<=r.end),categories=[...new Set(periodTransactions.filter(t=>t.type==='Expense').map(t=>t.category))];return hero('Finance','Track revenue, expenses, and studio performance.',addBtn('transactions','Add Transaction'))+`<div class="stats">${stat('Revenue',money(reportingTotals().revenue),'money','green',reportingPeriodLabel())}${stat('Expenses',money(reportingTotals().expenses),'chart','red',reportingPeriodLabel())}${stat('Net Profit',money(reportingTotals().revenue-reportingTotals().expenses),'trend','green',reportingPeriodLabel())}${stat('Outstanding',money(outstanding()),'clock')}</div><div class="grid two">${panel('Revenue & Expenses','chart',chart(),rangeControl())}${panel('Expense Breakdown','finance',`<div class="health"><div class="ring" style="background:${expenseGradient()}"><div class="ring-inner"><strong style="font-size:20px">${money(reportingTotals().expenses)}</strong><small>Period expenses</small></div></div><div class="health-list">${categories.map(c=>`<div><span>${esc(c)}</span><b>${reportingTotals().expenses?Math.round(periodTransactions.filter(t=>t.type==='Expense'&&t.category===c).reduce((s,t)=>s+ +t.amount,0)/reportingTotals().expenses*100):0}%</b></div>`).join('')}</div></div>`)}</div><div class="grid">${panel('Transactions','bills',`<div class="table-wrap"><table><thead><tr><th>Description</th><th>Category</th><th>Date</th><th>Type</th><th>Amount</th><th></th></tr></thead><tbody>${[...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(t.category)}</td><td>${date(t.date)}</td><td>${badge(t.type)}</td><td style="color:${t.type==='Income'?'#26754e':'#a83b32'}">${t.type==='Income'?'+':'−'}${money(t.amount)}</td><td><button class="iconbtn" data-edit="transactions:${t.id}" aria-label="Edit ${esc(t.title)}">${icon('edit')}</button></td></tr>`).join('')}</tbody></table></div>`,`<button data-action="export-transactions">${icon('download')}CSV</button>`)}</div>`}
function bills(){return hero('Bills & Invoices','Professional invoices. Clear payment tracking.',`<button class="primary" data-action="new-invoice">${icon('plus')}Create Invoice</button>`)+`<div class="stats">${stat('Invoices',db.invoices.length,'bills')}${stat('Paid',money(db.invoices.filter(i=>i.status==='Paid').reduce((s,i)=>s+totalInvoice(i),0)),'tasks','green')}${stat('Outstanding',money(outstanding()),'clock','red')}${stat('Drafts',db.invoices.filter(i=>i.status==='Draft').length,'edit','blue')}</div><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Client</th><th>Issued</th><th>Due Date</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${db.invoices.map(i=>`<tr><td>${esc(i.number)}</td><td>${esc(i.client)}</td><td>${date(i.issued)}</td><td>${date(i.due)}</td><td>${money(totalInvoice(i))}</td><td><select aria-label="Status for invoice ${esc(i.number)}" data-invoice-status="${i.id}">${options(['Draft','Sent','Paid','Overdue'],i.status)}</select></td><td><button data-open-invoice="${i.id}">${icon('edit')}Open</button></td></tr>`).join('')}</tbody></table></div><p class="section-note">Invoice statuses are tracked locally. Sending and payment collection are managed outside this app.</p>`}
function invoiceEditor(){if(!invoice)invoice={id:id(),number:db.settings.prefix+new Date().getFullYear()+'-'+String(db.invoices.length+1).padStart(3,'0'),client:db.clients[0]?.name||'',issued:today(),due:offset(14),notes:'Thank you for your business!',status:'Draft',tax:+db.settings.tax,items:[{description:'Design services',qty:1,rate:0}]};return heading('Create Invoice','Build and save professional invoices for your clients.',`<div class="row-actions"><button data-action="save-invoice">Save Draft</button><button class="primary" data-action="print-invoice">${icon('download')}Download PDF</button></div>`)+`<div class="invoice-layout"><section class="panel invoice-editor"><div class="panel-head"><h2>Invoice Details</h2><button data-go="bills">Back to Bills</button></div><div class="form-grid">${field('Client',clientDropdown(invoice.client,'data-invoice="client" required'))}${field('Invoice Number',`<input data-invoice="number" value="${esc(invoice.number)}">`)}${field('Issue Date',`<input type="date" data-invoice="issued" value="${invoice.issued}">`)}${field('Due Date',`<input type="date" data-invoice="due" value="${invoice.due}">`)}${field('Notes to Client',`<textarea data-invoice="notes">${esc(invoice.notes)}</textarea>`,'full')}${field('Tax (%)',`<input type="number" min="0" max="100" step="0.1" data-invoice="tax" value="${invoice.tax}">`)}${advanceFields()}</div><div class="panel-head"><h2>Invoice Items</h2><button data-action="add-invoice-item">${icon('plus')}Add Item</button></div><div class="invoice-item section-note"><span>Description</span><span>Qty</span><span>Rate</span></div><div id="invoice-items">${invoice.items.map((x,i)=>`<div class="invoice-item"><input aria-label="Item ${i+1} description" data-item="${i}:description" value="${esc(x.description)}"><input aria-label="Item ${i+1} quantity" type="number" min="0" step=".01" data-item="${i}:qty" value="${x.qty}"><input aria-label="Item ${i+1} rate" type="number" min="0" step=".01" data-item="${i}:rate" value="${x.rate}"><button data-remove-item="${i}" aria-label="Remove item ${i+1}">${icon('trash')}</button></div>`).join('')}</div><p class="section-note">Download PDF opens your browser’s print dialog. Choose “Save as PDF” for a clean invoice.</p></section><section id="invoice-paper" class="paper">${invoicePaper()}</section></div>`}
function invoicePaper(){const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:invoice.currency||db.settings.currency}).format(v||0);const subtotal=invoice.items.reduce((s,x)=>s+ +x.qty* +x.rate,0);return `<div class="paper-head"><div style="display:flex;gap:12px;align-items:center"><span class="logo">◕</span><div><h2>${esc(db.settings.brand)}</h2></div></div><h2 style="font-size:24px;color:#60636b">INVOICE</h2></div><div class="grid equal" style="margin-top:24px"><div><b>${esc(db.settings.studio)}</b><p>${esc(db.settings.address)}<br>${esc(db.settings.email)}</p></div><div style="text-align:right"><p>Invoice No: &nbsp; ${esc(invoice.number)}<br>Issue Date: &nbsp; ${date(invoice.issued)}<br>Due Date: &nbsp; ${date(invoice.due)}</p></div></div><h3>Bill To</h3><b>${esc(invoice.client)}</b><p>${esc(db.clients.find(c=>c.name===invoice.client)?.email||'')}</p><table><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${invoice.items.map(x=>`<tr><td>${esc(x.description)}</td><td>${x.qty}</td><td>${money(x.rate)}</td><td>${money(x.qty*x.rate)}</td></tr>`).join('')}</tbody></table><div class="paper-total"><span>Subtotal</span><b>${money(subtotal)}</b><span>Tax (${invoice.tax}%)</span><b>${money(subtotal*invoice.tax/100)}</b><strong>Total</strong><strong>${money(totalInvoice(invoice))}</strong></div>${advanceSummary()}<div class="signature">${esc(db.settings.brand)}</div><p>${esc(invoice.notes||'Thank you for your business!')}</p>`}

function saveInvoice(){if(!validateAdvance(invoice)){toast('Advance must be 0–100% or an amount between zero and the invoice total.');return false}if(!invoice.client.trim()||!invoice.number.trim()||!invoice.issued||!invoice.due){toast('Add a client, invoice number, and dates.');return false}if(db.invoices.some(i=>i.id!==invoice.id&&i.number===invoice.number)){toast('Invoice number already exists. Choose a unique number.');return false}if(!invoice.items.length||invoice.items.some(x=>!x.description.trim()||!Number.isFinite(x.qty)||!Number.isFinite(x.rate)||!Number.isFinite(x.qty*x.rate)||x.qty<=0||x.rate<0)||!Number.isFinite(invoice.tax)||!Number.isFinite(totalInvoice(invoice))||invoice.tax<0||invoice.tax>100){toast('Add valid invoice items and a tax rate from 0 to 100.');return false}invoice.currency=invoice.currency||db.settings.currency;const exists=db.invoices.some(i=>i.id===invoice.id);if(exists)db.invoices=db.invoices.map(i=>i.id===invoice.id?structuredClone(invoice):i);else db.invoices.unshift(structuredClone(invoice));save('Invoice saved: '+invoice.number);return true}

function portalHTML(data){return `<div class="portal-content"><h2>${esc(data.client.name)}</h2><p class="muted">Project milestones and updates</p>${data.projects.map(p=>`<section class="panel"><div class="panel-head"><h2>${esc(p.name)}</h2>${badge(p.status)}</div>${projectMilestones(p)}</section>`).join('')||'<p>No shared projects yet.</p>'}</div>`;}

async function renderPortal(){let cid;try{cid=decodeURIComponent(page.slice(7))}catch{cid='invalid'}$('#app').innerHTML=`<main class="portal-shell"><header><h1>Client Portal</h1><button id="portal-account">${session?'Account':'Sign In'}</button></header><div id="portal-body">${session?'Loading your projects…':'Sign in with the email your studio enabled for this portal.'}</div></main>`;$('#portal-account').onclick=accountDialog;if(!session)return;let result;try{result=await cloud.rpc('chakra_portal',{requested_client:cid})}catch(e){if($('#portal-body'))$('#portal-body').textContent='Portal unavailable: '+e.message;return}const {data,error}=result;if(page!=='portal='+encodeURIComponent(cid)&&page!=='portal='+cid)return;if(error){$('#portal-body').textContent=error.message;return}portalData=data;document.documentElement.style.setProperty('--accent',safeAccent(data.settings.accent));$('#portal-body').innerHTML=(safeImage(data.settings.appLogo)?`<img class="brand-image" alt="Studio logo" src="${safeImage(data.settings.appLogo)}">`:'')+`<p>${esc(data.settings.studio)}</p>`+portalHTML(data);}
function accountDialog(){if(!cloud){toast('Cloud connection is unavailable. Your local workspace remains usable.');return}if(session){modal('Your Account',`<p>${esc(session.user.email)}</p><p class="section-note">${access?esc(access.role)+' access':'No workspace access enabled for this email.'} · ${esc(cloudState)}</p><div class="account-actions">${access&&access.role!=='client'?`<button id="load-cloud">Reload Cloud Workspace</button>${access.role==='owner'?'<button id="upload-cloud">Upload This Workspace</button>':''}<button id="export-unsynced">Export Current Data</button>`:''}<button id="sign-out">Sign Out</button></div>`);if($('#load-cloud'))$('#load-cloud').onclick=()=>confirmCloudLoad();if($('#upload-cloud'))$('#upload-cloud').onclick=()=>confirmCloudUpload();if($('#export-unsynced'))$('#export-unsynced').onclick=()=>action('export');$('#sign-out').onclick=async()=>{const {error}=await cloud.auth.signOut();if(error){toast(error.message);return}session=null;access=null;cloudMode=false;cloudConflict=false;cloudPending=false;db=JSON.parse(localStorage.getItem(key))||structuredClone(seed);$('#modal').close();render()};return;}modal('Sign In',`<form id="auth-form">${field('Email',input('email','','email',true,'autocomplete="email"'))}${field('Password',input('password','','password',true,'minlength="8" autocomplete="current-password"'))}<div class="dialog-actions"><button class="primary" name="mode" value="login">Sign In</button><button name="mode" value="signup">Create Account</button></div><p id="auth-message" role="status" class="section-note"></p></form><p class="section-note">Use your own email. Creating an account does not grant access until the studio owner enables it.</p>`);$('#auth-form').onsubmit=async e=>{e.preventDefault();const form=e.target,v=Object.fromEntries(new FormData(form)),signup=e.submitter?.value==='signup';const msg=$('#auth-message');msg.textContent=signup?'Creating account…':'Signing in…';form.querySelectorAll('button').forEach(b=>b.disabled=true);try{const result=signup?await cloud.auth.signUp({email:v.email,password:v.password,options:{emailRedirectTo:APP_URL}}):await cloud.auth.signInWithPassword({email:v.email,password:v.password});if(result.error)throw result.error;if(!result.data.session){msg.textContent='Check your email to confirm your account, then sign in. If email delivery fails, the workspace owner needs to configure email delivery in Supabase.';return}session=result.data.session;await loadAccess();$('#modal').close();if(access?.role==='client'){page='portal='+access.client_id;render()}else if(access){await loadCloud(false);render();if(!cloudMode)accountDialog();}else{render();accountDialog()}}catch(err){msg.textContent=err.message;}finally{form.querySelectorAll('button').forEach(b=>b.disabled=false)}};}
async function loadAccess(){const {data,error}=await cloud.from('chakra_members').select('*').eq('email',session.user.email.toLowerCase()).eq('active',true).maybeSingle();if(error)throw error;access=data;}
async function loadCloud(force){const {data,error}=await cloud.from('chakra_workspace').select('*').eq('id',true).single();if(error)throw error;cloudRevision=Number(data.revision);if(data.data){if(!validDB(data.data))throw Error('Cloud workspace has an invalid format');db=data.data;cloudMode=true;cloudConflict=false;cloudPending=false;cloudState='Synced';}else{cloudState='Cloud workspace is empty';cloudMode=false;}return !!data.data;}
function confirmCloudLoad(){modal('Reload cloud data?',`<p>Unsynced changes will be replaced. Export them first if needed.</p><button id="backup-cloud">Export Current Data</button><button id="confirm-cloud-load" class="primary">Reload Cloud</button>`);$('#backup-cloud').onclick=()=>action('export');$('#confirm-cloud-load').onclick=async()=>{try{await loadCloud(true);$('#modal').close();render()}catch(e){toast(e.message)}};}
function confirmCloudUpload(){modal('Upload this workspace?',`<p>Upload ${db.projects.length} projects, ${db.tasks.length} tasks and studio settings to the shared workspace. This replaces existing cloud records.</p><p class="section-note">Your current browser workspace remains available when signed out.</p><button id="confirm-cloud-upload" class="primary">Upload Workspace</button>`);$('#confirm-cloud-upload').onclick=async()=>{try{const {data,error}=await cloud.from('chakra_workspace').select('revision').eq('id',true).single();if(error)throw error;cloudRevision=Number(data.revision);normalizeWorkspace();const result=await cloud.rpc('chakra_save',{payload:structuredClone(db),expected_revision:cloudRevision});if(result.error)throw result.error;cloudRevision=Number(result.data);cloudMode=true;cloudConflict=false;cloudPending=false;cloudState='Synced';toast('Workspace uploaded');$('#modal').close();render()}catch(e){toast(e.message)}};}
// Initialize only after all overrides are installed.
async function bootStudio(){normalizeWorkspace();render();if(!window.createSupabaseClient){cloudState='Cloud unavailable';return}cloud=window.createSupabaseClient(CLOUD_URL,CLOUD_KEY);if(page.startsWith('share=')){render();return;}try{const {data,error}=await cloud.auth.getSession();if(error)throw error;session=data.session;}catch(e){cloudState='Cloud unavailable';render();return;}if(session){try{await loadAccess();if(access&&access.role!=='client'&&!page.startsWith('share='))await loadCloud(false);}catch(e){cloudState='Cloud unavailable';}}render();if(page.startsWith('share='))return;void refreshFX();setInterval(()=>refreshFX(),3600000);window.addEventListener('focus',()=>refreshFX());window.addEventListener('beforeunload',e=>{if(cloudPending||cloudBusy){e.preventDefault();e.returnValue=''}});}
bootStudio();
</script></body></html>
